# Alternative to the Traefik overlay. Do not combine both proxy overlays.
# docker compose -f compose.yaml -f compose.caddy.yaml up -d --build --wait
services:
  app:
    ports: !reset []
    environment:
      PUBLIC_BASE_URL: https://${DOMAIN:?Set DOMAIN to your public hostname}
      ORIGIN: https://${DOMAIN:?Set DOMAIN to your public hostname}
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: '1'
  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    # The official binary carries this file capability; retain it so exec succeeds.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    pids_limit: 100
    mem_limit: 256m
    stop_grace_period: 15s
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your public hostname}
    ports:
      - '80:8080'
      - '443:8443'
      - '443:8443/udp'
    volumes:
      - type: bind
        source: ./docker/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/healthz]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  caddy_data:
  caddy_config:
