# Optional overlay, compatible with either proxy setup or local-only Compose.
services:
  app:
    environment:
      API_USERNAME: ''
      API_PASSWORD: ''
      API_USERNAME_FILE: /run/secrets/api_username
      API_PASSWORD_FILE: /run/secrets/api_password
    secrets:
      - api_username
      - api_password
secrets:
  api_username:
    file: ${API_USERNAME_SECRET_FILE:-./secrets/api_username}
  api_password:
    file: ${API_PASSWORD_SECRET_FILE:-./secrets/api_password}
